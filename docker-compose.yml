services:
  postgres:
    image: postgres:16-alpine
    container_name: portal_xdv_postgres
    environment:
      POSTGRES_DB: portal_xdv
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_xdv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portal_xdv_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
